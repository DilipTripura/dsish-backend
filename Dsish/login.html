<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dsish | Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Back Button -->
  <button class="back-btn" onclick="goBack()">← Go Back</button>

  <main class="auth-wrap fade-in">
    <div class="auth-card">

      <h1 class="brand">Dsish</h1>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in securely with your Google account</p>

      <!-- Google Login Button -->
      <button type="button" id="googleLoginBtn" class="google-btn">

        <!-- Google SVG -->
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.9 0 7.4 1.3 10.1 3.9l7.6-7.6C36.8 2.2 30.9 0 24 0 14.6 0 6.4 5.4 2.4 13.3l8.8 6.8C13 13.5 18 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.4c-.5 2.7-2 5-4.3 6.6l6.7 5.2c3.9-3.6 7.3-8.9 7.3-16.1z"/>
          <path fill="#FBBC05" d="M11.2 28.1c-1-2.7-1-5.6 0-8.3l-8.8-6.8C.8 16.6 0 20.2 0 24s.8 7.4 2.4 10.7l8.8-6.6z"/>
          <path fill="#34A853" d="M24 48c6.9 0 12.8-2.3 17.1-6.3l-6.7-5.2c-2 1.4-4.6 2.2-10.4 2.2-6 0-11-4-12.8-9.6l-8.8 6.6C6.4 42.6 14.6 48 24 48z"/>
        </svg>

        <span class="btn-text">Continue with Google</span>

        <!-- Spinner -->
        <div class="spinner"></div>

      </button>

      <p id="login-error" class="login-error"></p>

      <p class="small-note">
        By continuing, you agree to our <a href="terms.html">Terms & Privacy Policy</a>.
      </p>

    </div>
  </main>

  <script>
    function goBack() {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }
  </script>

  <script type="module" src="login.js"></script>

</body>
</html>
