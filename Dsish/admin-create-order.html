<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Create Manual Order</title>

<style>
body{
font-family:Arial;
max-width:600px;
margin:auto;
padding:40px;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:16px;
}

button{
padding:12px 20px;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Create Manual Order</h2>

<form id="manualOrderForm">

<label>Customer Email</label>
<input id="email" required>

<label>Product Name</label>
<input id="productName" required>

<label>Product Image URL</label>
<input id="thumbnail" required>

<label>Size</label>
<input id="size">

<label>Price</label>
<input id="price" type="number" required>

<label>Paid Amount</label>
<input type="number" id="paidAmount" placeholder="Enter paid amount" value="0">

<label>Quantity</label>
<input id="qty" type="number" value="1" required>

<label>Customer Name</label>
<input id="name" required>

<label>Phone</label>
<input id="phone" required>

<label>Address Line</label>
<input id="line1" required>

<label>City</label>
<input id="city" required>

<label>State</label>
<input id="state" required>

<label>Pincode</label>
<input id="pincode" required>

<label>Payment Type</label>
<select id="paymentType">
<option value="cod">Cash on Delivery</option>
<option value="partial">Partial Payment</option>
</select>

<button type="submit">Create Order</button>

</form>

<p id="status"></p>

<script type="module" src="./admin-create-order.js"></script>

</body>
</html>
